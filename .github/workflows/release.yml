name: "Release Windows Desktop App"

on:
  push:
    tags:
      - "v*" # Triggers automatically when a version tag like v1.0.0 is pushed
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release Version Tag (e.g. v1.0.0)"
        required: false
        default: "v1.0.0"
      draft:
        description: "Create as Draft Release"
        type: boolean
        required: false
        default: false
      prerelease:
        description: "Mark as Prerelease"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Windows Application (.exe & .msi)
    runs-on: windows-latest

    env:
      NODE_OPTIONS: "--max-old-space-size=4096"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install Frontend Dependencies
        run: npm install

      - name: Build Tauri App & Publish Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag_name || 'v1.0.0' }}
          releaseName: "ZEC Portal v__VERSION__"
          releaseBody: |
            ## Zakariya Educational Complex (ZEC) Portal - Windows Desktop App

            Official desktop application release for Zakariya Educational Complex.

            ### 📥 Download Windows Installers:
            - **Standard Setup Installer (.exe)**: `ZEC Portal_*_x64-setup.exe` (NSIS installer — recommended for desktop PCs and workstations)
            - **Enterprise Windows Package (.msi)**: `ZEC Portal_*_x64_en-US.msi` (MSI installer — for IT group policy & enterprise deployments)

            ---
            *Built automatically via GitHub Actions with Tauri v2.*
          releaseDraft: ${{ inputs.draft || false }}
          prerelease: ${{ inputs.prerelease || false }}
          args: --target x86_64-pc-windows-msvc

      - name: Upload Windows Installers as Workflow Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zec-portal-windows-installers
          path: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: warn
